<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d38">
  <meta name="description" content="FoodBridge connects restaurants with surplus food to community kitchens and NGOs.">
  <title>FoodBridge — Rescuing food. Building trust.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="FoodBridge home"><span class="brand-mark">f</span><span>foodbridge</span></a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button data-page="home" class="nav-link active">Home</button>
      <button data-page="explore" class="nav-link">Explore donations</button>
      <button data-page="directory" class="nav-link">NGO directory</button>
      <button data-page="dashboard" class="nav-link dashboard-nav hidden">My dashboard</button>
      <button data-page="foodtrust" class="nav-link">FoodTrust</button>
      <button data-page="admin" class="nav-link admin-nav hidden" id="admin-nav">Admin review</button>
    </nav>
    <div class="header-actions">
      <button id="account-action" class="button button-secondary" data-page="login">Log in</button>
      <button id="primary-action" class="button button-primary header-cta" data-page="contact">Contact us <span aria-hidden="true">↗</span></button>
      <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
    </div>
  </header>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation">
    <button data-page="home">Home</button><button data-page="explore">Explore donations</button>
    <button data-page="directory">NGO directory</button>
    <button data-page="dashboard" class="dashboard-nav hidden">My dashboard</button>
    <button data-page="foodtrust">FoodTrust</button>
  </nav>

  <main id="main-content" class="main-shell" tabindex="-1">
    <section id="view-home" class="page-view"></section>
    <section id="view-explore" class="page-view hidden"></section>
    <section id="view-detail" class="page-view hidden"></section>
    <section id="view-create" class="page-view hidden"></section>
    <section id="view-directory" class="page-view hidden"></section>
    <section id="view-dashboard" class="page-view hidden"></section>
    <section id="view-foodtrust" class="page-view hidden"></section>
    <section id="view-profiles" class="page-view hidden"></section>
    <section id="view-login" class="page-view hidden"></section>
    <section id="view-admin" class="page-view hidden"></section>
    <section id="view-contact" class="page-view hidden"></section>
  </main>

  <footer class="site-footer"><div class="footer-brand"><span class="brand-mark">f</span> foodbridge</div><p>Rescuing food. Building trust. Feeding communities.</p><button class="text-link button button-quiet" data-page="contact">Contact us</button><br><small>FoodBridge supports informed decisions. It is not a food-safety certification service.</small></footer>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
